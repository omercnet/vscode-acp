name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag whose VSIX should be republished
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        id: release
        with:
          release-type: node

  prepare-vsix:
    needs: release-please
    if: >-
      always() &&
      ((github.event_name == 'push' &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          AUTOMATIC_TAG: ${{ needs.release-please.outputs.tag_name }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$RECOVERY_TAG"
          else
            tag="$AUTOMATIC_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out released source
        if: github.event_name == 'push'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version-file: "package.json"
          cache: "npm"

      - name: Install dependencies
        if: github.event_name == 'push'
        run: npm ci

      - name: Run tests
        if: github.event_name == 'push'
        run: xvfb-run -a npm test

      - name: Package extension once
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p release
          npx --no-install vsce package --no-dependencies \
            --out "release/vscode-acp-${RELEASE_TAG#v}.vsix"

      - name: Upload VSIX to GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.vsix

      - name: Download VSIX from existing GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --pattern '*.vsix' --dir release

      - name: Select the single release VSIX
        id: vsix
        run: |
          shopt -s nullglob
          files=(release/*.vsix)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one VSIX, found ${#files[@]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload publication artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-vsix
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-marketplace:
    needs: prepare-vsix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: "22"

      - name: Install Marketplace CLI
        run: npm install --global @vscode/vsce@3.9.2

      - name: Download publication artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-vsix
          path: release

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          shopt -s nullglob
          files=(release/*.vsix)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one VSIX, found ${#files[@]}" >&2
            exit 1
          fi

          max_attempts=4
          for (( attempt=1; attempt<=max_attempts; attempt++ )); do
            set +e
            timeout --signal=TERM --kill-after=30s 4m \
              vsce publish --packagePath "${files[0]}" --skip-duplicate
            status=$?
            set -e

            if (( status == 0 )); then
              exit 0
            fi
            if (( attempt == max_attempts )); then
              echo "Marketplace publish failed after $max_attempts attempts" >&2
              exit "$status"
            fi

            delay=$((15 * 2 ** (attempt - 1)))
            echo "Marketplace publish attempt $attempt/$max_attempts failed; retrying in ${delay}s"
            sleep "$delay"
          done

  publish-openvsx:
    needs: prepare-vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: "22"

      - name: Install Open VSX CLI
        run: npm install --global ovsx@1.1.1

      - name: Download publication artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-vsix
          path: release

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          shopt -s nullglob
          files=(release/*.vsix)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one VSIX, found ${#files[@]}" >&2
            exit 1
          fi

          timeout --signal=TERM --kill-after=30s 5m \
            ovsx publish "${files[0]}" --skip-duplicate
