name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (Linux)
        run: xvfb-run -a npm run coverage
        if: runner.os == 'Linux'

      - name: Run tests with coverage (non-Linux)
        run: npm run coverage
        if: runner.os != 'Linux'

      - name: Agent resolution smoke (real spawn)
        run: npm run smoke:agent-resolution

      - name: Deterministic Extension Host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Restricted Mode agent resolution demo (non-Linux)
        if: runner.os != 'Linux'
        run: npm run test:e2e -- e2e/agent-resolution.spec.ts

      - name: Upload coverage report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: runner.os == 'Linux'
        with:
          name: coverage-report
          path: coverage/

      - name: Check coverage
        if: runner.os == 'Linux'
        run: |
          awk '
            /^SF:/ { source = $0 ~ /^SF:src\// && $0 !~ /^SF:src\/test\// }
            source && /^LH:/ { lh += substr($0, 4) }
            source && /^LF:/ { lf += substr($0, 4) }
            source && /^BRH:/ { brh += substr($0, 5) }
            source && /^BRF:/ { brf += substr($0, 5) }
            source && /^FNH:/ { fnh += substr($0, 5) }
            source && /^FNF:/ { fnf += substr($0, 5) }
            END {
              lines = 100 * lh / lf
              branches = 100 * brh / brf
              functions = 100 * fnh / fnf
              printf "## Coverage Report\n\n| Metric | Coverage |\n|---|---:|\n| Lines | %.2f%% (%d/%d) |\n| Branches | %.2f%% (%d/%d) |\n| Functions | %.2f%% (%d/%d) |\n", lines, lh, lf, branches, brh, brf, functions, fnh, fnf > ENVIRON["GITHUB_STEP_SUMMARY"]
              if (lines < 87 || branches < 80 || functions < 83) exit 1
            }
          ' coverage/lcov.info

      - name: Comment Coverage on PR
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            const lcov = fs.readFileSync('coverage/lcov.info', 'utf8');
            const totals = { LF: 0, LH: 0, BRF: 0, BRH: 0, FNF: 0, FNH: 0 };
            for (const record of lcov.split('end_of_record')) {
              const source = record.match(/^SF:(.+)$/m)?.[1];
              if (!source?.startsWith('src/') || source.startsWith('src/test/')) continue;
              for (const key of Object.keys(totals)) {
                totals[key] += Number(record.match(new RegExp(`^${key}:(\\d+)$`, 'm'))?.[1] ?? 0);
              }
            }
            const metric = (hit, found) => `${(100 * hit / found).toFixed(2)}% (${hit}/${found})`;
            const body = `## Coverage Report\n\n| Metric | Coverage |\n|---|---:|\n| Lines | ${metric(totals.LH, totals.LF)} |\n| Branches | ${metric(totals.BRH, totals.BRF)} |\n| Functions | ${metric(totals.FNH, totals.FNF)} |`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('📊 Coverage Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Package extension
        run: npx vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: runner.os == 'Linux'
        with:
          name: vscode-acp-vsix
          path: "*.vsix"
